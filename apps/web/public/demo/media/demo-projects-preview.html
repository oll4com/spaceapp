<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Space Sample Project</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#101719;color:#e8f6f2}
    *{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:720px;margin:auto}
    .eyebrow{color:#7bd6bf;font-size:12px;letter-spacing:.15em;text-transform:uppercase}h1{font-size:28px;margin:8px 0}
    p{color:#a8bdb8;line-height:1.5}.card{background:#19272a;border:1px solid #365054;border-radius:16px;padding:20px;margin-top:18px}
    label{display:block;font-size:13px;margin:14px 0 6px}input{width:100%;border:1px solid #557077;border-radius:8px;background:#0e1a1d;color:#fff;padding:11px}
    button{background:#79d9bc;color:#102320;border:0;border-radius:8px;padding:11px 16px;font-weight:700;margin-top:16px;cursor:pointer}
    li{padding:9px 0;border-bottom:1px solid #365054}small{color:#92aaa4}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Space · Browser-local sample</div>
    <h1>Lead Capture</h1>
    <p>Try a sample submission. Entries stay in this preview and are never sent to a server or an integration.</p>
    <div class="card">
      <form id="lead-form">
        <label for="name">Name</label><input id="name" required maxlength="80" autocomplete="off" placeholder="Alex Visitor">
        <label for="company">Company</label><input id="company" required maxlength="80" autocomplete="off" placeholder="Sample Company">
        <button type="submit">Add sample lead</button>
      </form>
    </div>
    <div class="card"><strong>Sample leads</strong><ul id="leads"><li>Space Visitor · Sample Company</li></ul><small id="count">1 local entry</small></div>
  </div>
  <script src="./demo-projects-preview.js"></script>
</body>
</html>
