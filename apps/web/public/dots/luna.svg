<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" fill="none" role="img" aria-labelledby="luna-title">
  <title id="luna-title">Luna, original Space Dots crescent moon</title>
  <defs>
    <path id="luna-silhouette" d="M223 69C177 43 119 59 91 96C68 125 66 166 82 200C99 234 131 255 166 254C194 254 219 244 237 224C201 231 175 214 162 188C141 146 160 96 199 78C207 74 215 71 223 69Z"/>
    <radialGradient id="luna-body" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(112 104) rotate(49) scale(165 137)">
      <stop stop-color="#F3F3E7"/><stop offset=".29" stop-color="#DDE6E5"/><stop offset=".58" stop-color="#BACCD7"/><stop offset=".8" stop-color="#94ADC4"/><stop offset="1" stop-color="#708CA9"/>
    </radialGradient>
    <linearGradient id="luna-edge" x1="98" y1="103" x2="211" y2="245" gradientUnits="userSpaceOnUse"><stop stop-color="#BACBD2"/><stop offset="1" stop-color="#5A7498"/></linearGradient>
    <linearGradient id="luna-rim" x1="98" y1="73" x2="87" y2="213" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFF0" stop-opacity=".8"/><stop offset="1" stop-color="#FFFFF0" stop-opacity="0"/></linearGradient>
    <radialGradient id="luna-crater" cx=".58" cy=".7" r=".76"><stop stop-color="#A8BFCB" stop-opacity=".12"/><stop offset=".58" stop-color="#809CAC" stop-opacity=".18"/><stop offset=".9" stop-color="#6A879F" stop-opacity=".27"/><stop offset="1" stop-color="#6A879F" stop-opacity="0"/></radialGradient>
    <radialGradient id="luna-blush" cx=".4" cy=".4" r=".7"><stop stop-color="#9795B2" stop-opacity=".25"/><stop offset="1" stop-color="#9795B2" stop-opacity="0"/></radialGradient>
    <clipPath id="luna-clip"><use href="#luna-silhouette"/></clipPath>
    <filter id="luna-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="3" seed="31" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".12"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="in" result="texture"/>
      <feBlend in="SourceGraphic" in2="texture" mode="soft-light"/>
    </filter>
    <filter id="luna-shadow" x="-30%" y="-180%" width="160%" height="460%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="luna-soft" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <ellipse cx="159" cy="267" rx="58" ry="5" fill="#293D57" opacity=".14" filter="url(#luna-shadow)"/>
  <use href="#luna-silhouette" transform="translate(1.5 2)" fill="url(#luna-edge)"/>
  <g filter="url(#luna-grain)">
    <use href="#luna-silhouette" fill="url(#luna-body)"/>
    <g clip-path="url(#luna-clip)">
      <path d="M198 81C162 101 146 139 158 176C168 209 193 232 225 232" stroke="#4D6E94" stroke-width="13" stroke-linecap="round" opacity=".15" filter="url(#luna-soft)"/>
      <path d="M103 209C117 231 149 247 178 245" stroke="#7D94B1" stroke-width="12" stroke-linecap="round" opacity=".15" filter="url(#luna-soft)"/>
      <ellipse cx="123" cy="106" rx="16" ry="12" transform="rotate(-26 123 106)" fill="url(#luna-crater)"/>
      <path d="M111 114C117 119 130 116 136 108" stroke="#F2F2E7" stroke-width="2" stroke-linecap="round" opacity=".38"/>
      <ellipse cx="109" cy="211" rx="12" ry="10" transform="rotate(34 109 211)" fill="url(#luna-crater)"/>
      <path d="M101 215C103 221 112 224 117 220" stroke="#D8E5E4" stroke-width="1.6" stroke-linecap="round" opacity=".44"/>
      <ellipse cx="173" cy="235" rx="16" ry="7" transform="rotate(8 173 235)" fill="url(#luna-crater)"/>
      <path d="M160 237C164 242 177 244 186 239" stroke="#C7D6DE" stroke-width="1.5" stroke-linecap="round" opacity=".42"/>
      <ellipse cx="96" cy="135" rx="5" ry="4" fill="#7F9CAC" opacity=".16"/>
      <ellipse cx="158" cy="83" rx="6" ry="4" transform="rotate(-15 158 83)" fill="#7F9CAC" opacity=".16"/>
      <ellipse cx="132" cy="224" rx="4" ry="3" fill="#6583A0" opacity=".18"/>
      <path d="M91 171C87 159 89 148 94 141" stroke="#F5F5E9" stroke-width="8" stroke-linecap="round" opacity=".18" filter="url(#luna-soft)"/>
      <ellipse cx="97" cy="178" rx="12" ry="8" transform="rotate(8 97 178)" fill="url(#luna-blush)"/>
      <ellipse cx="147" cy="180" rx="10" ry="8" fill="url(#luna-blush)"/>
    </g>
    <path d="M81 148C82 113 105 78 142 69C161 64 177 64 191 66" stroke="url(#luna-rim)" stroke-width="3" stroke-linecap="round"/>
    <path d="M166 201C179 220 199 229 218 228" stroke="#D7E2E2" stroke-width="2" stroke-linecap="round" opacity=".3"/>
  </g>
  <ellipse cx="108" cy="155" rx="6" ry="8" transform="rotate(6 108 155)" fill="#2A384C"/>
  <ellipse cx="139" cy="157" rx="6" ry="8" transform="rotate(6 139 157)" fill="#2A384C"/>
  <ellipse cx="106.5" cy="152.6" rx="1.6" ry="1.8" fill="#F3F4E8" opacity=".5"/>
  <ellipse cx="137.5" cy="154.6" rx="1.6" ry="1.8" fill="#F3F4E8" opacity=".5"/>
  <path d="M116 177C120 182 126 184 133 178" stroke="#41536C" stroke-width="3.3" stroke-linecap="round"/>
</svg>
