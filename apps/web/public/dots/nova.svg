<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" fill="none" role="img" aria-labelledby="nova-title">
  <title id="nova-title">Nova, original Space Dots star</title>
  <defs>
    <path id="nova-silhouette" d="M158 55C168 54 177 87 189 109C213 114 249 112 256 124C263 136 233 156 216 175C218 200 235 234 225 244C215 254 181 231 158 220C135 231 103 256 93 246C83 236 100 201 101 176C84 158 53 137 59 125C65 113 101 114 125 108C137 86 148 56 158 55Z"/>
    <radialGradient id="nova-body" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(125 110) rotate(55) scale(159 153)">
      <stop stop-color="#FFF4CB"/><stop offset=".36" stop-color="#FFE6AD"/><stop offset=".68" stop-color="#EFC585"/><stop offset=".88" stop-color="#DCA660"/><stop offset="1" stop-color="#BE813F"/>
    </radialGradient>
    <linearGradient id="nova-edge" x1="90" y1="100" x2="209" y2="253" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E9C98D"/><stop offset=".55" stop-color="#C99654"/><stop offset="1" stop-color="#AC703B"/>
    </linearGradient>
    <radialGradient id="nova-cheek" cx=".4" cy=".3" r=".7"><stop stop-color="#D98960" stop-opacity=".38"/><stop offset="1" stop-color="#D98960" stop-opacity="0"/></radialGradient>
    <linearGradient id="nova-rim" x1="104" y1="91" x2="194" y2="216" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFE5" stop-opacity=".85"/><stop offset="1" stop-color="#FFFFE5" stop-opacity="0"/></linearGradient>
    <clipPath id="nova-clip"><use href="#nova-silhouette"/></clipPath>
    <filter id="nova-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="3" seed="19" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".12"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="in" result="texture"/>
      <feBlend in="SourceGraphic" in2="texture" mode="soft-light"/>
    </filter>
    <filter id="nova-shadow" x="-30%" y="-180%" width="160%" height="460%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="nova-soft" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <ellipse cx="158" cy="261" rx="67" ry="6" fill="#5A4538" opacity=".13" filter="url(#nova-shadow)"/>
  <use href="#nova-silhouette" transform="translate(0 3)" fill="url(#nova-edge)"/>
  <g filter="url(#nova-grain)">
    <use href="#nova-silhouette" fill="url(#nova-body)"/>
    <g clip-path="url(#nova-clip)">
      <path d="M163 69C165 89 175 113 192 124C214 128 237 126 253 127C234 145 215 160 206 177C208 202 220 230 220 244" stroke="#BB7439" stroke-width="15" stroke-linecap="round" opacity=".13" filter="url(#nova-soft)"/>
      <path d="M112 174C109 198 99 224 96 240M150 207C129 219 113 235 99 241" stroke="#FFE8B3" stroke-width="9" stroke-linecap="round" opacity=".35" filter="url(#nova-soft)"/>
      <path d="M123 126C133 119 147 104 154 83" stroke="#FFFFE2" stroke-width="18" stroke-linecap="round" opacity=".3" filter="url(#nova-soft)"/>
      <path d="M159 213C178 221 205 241 221 244" stroke="#B17B43" stroke-width="4" stroke-linecap="round" opacity=".23"/>
    </g>
    <path d="M69 126C83 122 108 125 125 117C140 100 148 78 155 67" stroke="url(#nova-rim)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M67 133C74 141 87 151 95 158" stroke="#FFF2CB" stroke-width="2.5" stroke-linecap="round" opacity=".48"/>
    <path d="M190 120C211 125 236 119 246 125" stroke="#FFF1C6" stroke-width="2" stroke-linecap="round" opacity=".45"/>
    <ellipse cx="114" cy="173" rx="15" ry="10" fill="url(#nova-cheek)"/>
    <ellipse cx="196" cy="170" rx="15" ry="10" fill="url(#nova-cheek)"/>
  </g>
  <!-- A small asymmetric smile gives Nova quiet confidence. -->
  <path d="M124 137C127 134 132 134 135 136" stroke="#8D633F" stroke-width="2.5" stroke-linecap="round" opacity=".54"/>
  <path d="M177 135C180 133 184 134 187 135" stroke="#8D633F" stroke-width="2.5" stroke-linecap="round" opacity=".54"/>
  <ellipse cx="132" cy="151" rx="6.2" ry="8" fill="#263447"/>
  <ellipse cx="180" cy="149" rx="6.2" ry="8" fill="#263447"/>
  <ellipse cx="130.4" cy="148.6" rx="1.6" ry="2" fill="#FFF8DE" opacity=".53"/>
  <ellipse cx="178.4" cy="146.6" rx="1.6" ry="2" fill="#FFF8DE" opacity=".53"/>
  <path d="M148 174C154 178 162 179 169 171" stroke="#5B3D35" stroke-width="3.8" stroke-linecap="round"/>
  <path d="M165 171L171 172" stroke="#5B3D35" stroke-width="2.4" stroke-linecap="round"/>
</svg>
