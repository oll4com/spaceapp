<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" fill="none" role="img" aria-labelledby="orbit-title">
  <title id="orbit-title">Orbit, original Space Dots astronaut</title>
  <defs>
    <radialGradient id="orbit-suit" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(128 143) rotate(58) scale(119 101)">
      <stop stop-color="#FFFCED"/><stop offset=".47" stop-color="#EFEADB"/><stop offset=".82" stop-color="#D7D7CE"/><stop offset="1" stop-color="#AEBFC4"/>
    </radialGradient>
    <radialGradient id="orbit-helmet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(136 75) rotate(53) scale(112 108)">
      <stop stop-color="#FFFEF1"/><stop offset=".5" stop-color="#EEEBDD"/><stop offset=".85" stop-color="#C8D1CE"/><stop offset="1" stop-color="#94ABB4"/>
    </radialGradient>
    <radialGradient id="orbit-glass" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(143 96) rotate(57) scale(69 84)">
      <stop stop-color="#395163"/><stop offset=".4" stop-color="#20374B"/><stop offset=".82" stop-color="#13283B"/><stop offset="1" stop-color="#0D2030"/>
    </radialGradient>
    <linearGradient id="orbit-trim" x1="111" y1="166" x2="190" y2="249" gradientUnits="userSpaceOnUse">
      <stop stop-color="#98AFB8"/><stop offset=".5" stop-color="#6E8A99"/><stop offset="1" stop-color="#496A7D"/>
    </linearGradient>
    <linearGradient id="orbit-gold" x1="128" y1="86" x2="174" y2="115" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF2C7"/><stop offset=".55" stop-color="#E8C88B"/><stop offset="1" stop-color="#BA9765"/>
    </linearGradient>
    <linearGradient id="orbit-reflection" x1="129" y1="88" x2="156" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E6EEEA" stop-opacity=".56"/><stop offset="1" stop-color="#BDCFD4" stop-opacity="0"/>
    </linearGradient>
    <filter id="orbit-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="3" seed="11" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".11"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="in" result="texture"/>
      <feBlend in="SourceGraphic" in2="texture" mode="soft-light"/>
    </filter>
    <filter id="orbit-shadow" x="-30%" y="-180%" width="160%" height="460%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="orbit-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <ellipse cx="162" cy="266" rx="64" ry="5" fill="#263D50" opacity=".15" filter="url(#orbit-shadow)"/>
  <!-- A little exposed backpack makes the padded silhouette read as a suit. -->
