<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" fill="none" role="img" aria-labelledby="cosmo-title">
  <title id="cosmo-title">Cosmo, original Space Dots ringed planet</title>
  <defs>
    <radialGradient id="cosmo-body" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(128 101) rotate(50) scale(134 125)">
      <stop stop-color="#E6E0EE"/><stop offset=".3" stop-color="#CACAE6"/><stop offset=".62" stop-color="#A2AED6"/><stop offset=".85" stop-color="#7E91BF"/><stop offset="1" stop-color="#5D709C"/>
    </radialGradient>
    <linearGradient id="cosmo-ring-back" x1="76" y1="127" x2="233" y2="222" gradientUnits="userSpaceOnUse"><stop stop-color="#C8BAA9"/><stop offset=".4" stop-color="#E8DBC0"/><stop offset="1" stop-color="#AF9C8B"/></linearGradient>
    <linearGradient id="cosmo-ring-front" x1="68" y1="153" x2="251" y2="226" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF1D1"/><stop offset=".35" stop-color="#F1E5CB"/><stop offset=".72" stop-color="#DAC9AC"/><stop offset="1" stop-color="#C2AE96"/></linearGradient>
    <linearGradient id="cosmo-ring-lip" x1="74" y1="155" x2="245" y2="236" gradientUnits="userSpaceOnUse"><stop stop-color="#DCCCAF"/><stop offset="1" stop-color="#A28F83"/></linearGradient>
    <linearGradient id="cosmo-band-light" x1="110" y1="111" x2="192" y2="156" gradientUnits="userSpaceOnUse"><stop stop-color="#F0E3EC" stop-opacity=".46"/><stop offset="1" stop-color="#D0C9E6" stop-opacity=".14"/></linearGradient>
    <radialGradient id="cosmo-cheek" cx=".4" cy=".4" r=".7"><stop stop-color="#B786A3" stop-opacity=".28"/><stop offset="1" stop-color="#B786A3" stop-opacity="0"/></radialGradient>
    <clipPath id="cosmo-planet-clip"><circle cx="160" cy="151" r="79"/></clipPath>
    <filter id="cosmo-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="3" seed="37" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".11"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="in" result="texture"/>
      <feBlend in="SourceGraphic" in2="texture" mode="soft-light"/>
    </filter>
    <filter id="cosmo-shadow" x="-30%" y="-180%" width="160%" height="460%"><feGaussianBlur stdDeviation="3.5"/></filter>
    <filter id="cosmo-soft" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <ellipse cx="161" cy="254" rx="65" ry="5" fill="#343D59" opacity=".13" filter="url(#cosmo-shadow)"/>
  <g filter="url(#cosmo-grain)">
    <!-- The far half of the annulus is physically behind the sphere. -->
    <path d="M61 157C58 155 57 153 58 151C64 135 115 145 174 168C232 191 270 216 264 232L243 220C246 213 213 191 165 173C117 154 77 145 73 155Z" fill="url(#cosmo-ring-back)"/>
    <path d="M59 150C68 136 119 149 174 170C226 190 266 216 264 228" stroke="#F1E3C7" stroke-width="2" stroke-linecap="round" opacity=".65"/>
    <circle cx="160" cy="151" r="79" fill="url(#cosmo-body)"/>
    <g clip-path="url(#cosmo-planet-clip)">
      <path d="M93 105C124 93 194 111 231 136" stroke="url(#cosmo-band-light)" stroke-width="11" stroke-linecap="round"/>
      <path d="M84 123C117 109 190 128 238 154" stroke="#E0D4EA" stroke-width="3" stroke-linecap="round" opacity=".17"/>
      <path d="M89 182C127 177 188 191 226 210" stroke="#667CAF" stroke-width="12" stroke-linecap="round" opacity=".16"/>
      <path d="M81 192C122 183 184 200 222 220" stroke="#E0D4EA" stroke-width="4" stroke-linecap="round" opacity=".18"/>
      <path d="M214 101C242 143 233 192 207 208C184 224 161 227 143 223" stroke="#4B608D" stroke-width="13" stroke-linecap="round" opacity=".14" filter="url(#cosmo-soft)"/>
      <path d="M82 172C119 181 163 202 199 213C214 218 224 219 233 219" stroke="#465B88" stroke-width="9" stroke-linecap="round" opacity=".2" filter="url(#cosmo-soft)"/>
      <ellipse cx="114" cy="155" rx="13" ry="9" fill="url(#cosmo-cheek)"/>
      <ellipse cx="199" cy="160" rx="13" ry="9" fill="url(#cosmo-cheek)"/>
    </g>
    <path d="M90 132C96 104 121 82 149 80" stroke="#EEEAF1" stroke-width="3" stroke-linecap="round" opacity=".63"/>
    <path d="M91 143L90 149" stroke="#EBE8EC" stroke-width="2.5" stroke-linecap="round" opacity=".45"/>
    <!-- A continuous foreground sweep crosses the lower hemisphere. -->
    <path d="M58 154C51 170 96 199 153 221C210 243 257 251 264 232L243 220C240 230 204 223 158 205C110 187 73 162 74 154Z" transform="translate(0 2)" fill="url(#cosmo-ring-lip)"/>
    <path d="M58 153C51 169 96 198 153 220C210 242 257 250 264 232L243 220C240 229 204 222 158 204C110 186 73 161 74 153Z" fill="url(#cosmo-ring-front)"/>
    <path d="M60 157C58 170 101 196 155 217C208 237 252 245 261 232" stroke="#FFF2D6" stroke-width="2" stroke-linecap="round" opacity=".75"/>
    <path d="M63 163C73 181 111 202 155 219C202 237 242 246 256 238" stroke="#BAA38E" stroke-width="1.2" stroke-linecap="round" opacity=".32"/>
    <path d="M80 166C94 179 125 195 158 207C191 220 220 227 235 226" stroke="#FFF0D0" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
  </g>
  <g transform="rotate(5 158 146)">
    <ellipse cx="132" cy="140" rx="6" ry="8" fill="#2D354E"/>
    <ellipse cx="180" cy="140" rx="6" ry="8" fill="#2D354E"/>
    <ellipse cx="130.4" cy="137.5" rx="1.5" ry="1.9" fill="#EAE7F0" opacity=".55"/>
    <ellipse cx="178.4" cy="137.5" rx="1.5" ry="1.9" fill="#EAE7F0" opacity=".55"/>
    <path d="M148 161C153 167 160 168 166 161" stroke="#4A4162" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
