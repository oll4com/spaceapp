services:
  spaceapp-core:
    image: ghcr.io/oll4com/spaceapp-core:${SPACEAPP_IMAGE_TAG}${SPACEAPP_CORE_IMAGE_DIGEST:-}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: "${SPACEAPP_CORE_MEMORY_LIMIT}"
    cpus: "${SPACEAPP_CORE_CPU_LIMIT}"
    environment:
      SPACE_PUBLIC_DISTRIBUTION: "true"
      SPACE_AGENT_TOOLS_WRITER: "disabled"
      SPACE_DEV_LOGIN: "false"
      SPACE_APP_VERSION: "${SPACEAPP_IMAGE_TAG}"
      SPACE_TELEMETRY_ENABLED: "${SPACEAPP_TELEMETRY}"
      SPACE_OPTIONAL_MODULES: "${SPACEAPP_OPTIONAL_MODULES:-all}"
      SPACE_INSTALL_ID: "${SPACEAPP_INSTALL_ID:-}"
      SPACE_RUNTIME_STORE: postgres
      SPACE_DATABASE_URL_SOURCE_FILE: /run/secrets/database-url
      SPACE_DATABASE_URL_FILE: /run/spaceapp/database-url
      SPACE_SESSION_SECRET_FILE: /run/secrets/session-secret
      SPACE_SETUP_TOKEN_SOURCE_FILE: /run/secrets/setup-token
      SPACE_API_HOST: 127.0.0.1
      SPACE_API_PORT: 4910
      SPACE_WEB_HOST: 0.0.0.0
      SPACE_WEB_PORT: 4911
      SPACE_API_ORIGIN: http://127.0.0.1:4910
      SPACE_TEMPORAL_ADDRESS: temporal:7233
      SPACEAPP_WORKFLOWS_ENABLED: "${SPACEAPP_WORKFLOWS_ENABLED}"
      SPACE_MEMORY_ROOT: /var/lib/spaceapp/memory
      SPACE_STARTER_MEMORY_ROOT: /opt/spaceapp/starter-memory
      SPACE_MEMORY_GRAPH_ROOT: /var/lib/spaceapp/memory-graph
      SPACE_MEMORY_INDEX_PATH: /var/lib/spaceapp/memory/space_memory.md
      SPACE_MEMORY_MONTHLY_PATH: /var/lib/spaceapp/memory/space_memory_monthly.md
      SPACE_MEMORY_LOCK_PATH: /var/lib/spaceapp/memory/.memory.lock
      SPACE_ARTIFACT_ROOT: /var/lib/spaceapp/artifacts
      SPACE_CLI_HOST_SOCKET: /run/spaceapp-cli/host.sock
      SPACE_CLI_ENABLED: "true"
      SPACE_CLI_COMMAND_PATH: /usr/local/bin
      SPACE_CLI_WORKSPACE_ROOT: /workspaces
      SPACE_CODEX_HOME: /var/lib/spaceapp-cli/providers/codex
      SPACE_CODEX_APP_SERVER_HOME: /var/lib/spaceapp-cli/providers/codex
      SPACE_CODEX_APP_SERVER_COMMAND: /usr/local/bin/codex-vscode-parity
      SPACE_CODEX_ROUTE_COMMAND: /usr/local/bin/codex-vscode-parity
      SPACE_CODEX_GOALS_DB_PATH: /var/lib/spaceapp/codex-goals.sqlite
      SPACE_CODEX_CLI_MODE_DEFAULTS_PROJECTION_PATH: /var/lib/spaceapp/codex-cli-mode-defaults-v1.json
      SPACE_TELEGRAM_SECRET_ROOT: /var/lib/spaceapp/telegram
      SPACE_TELEGRAM_OWNERSHIP_MANIFEST: /var/lib/spaceapp/integrations/telegram/thread-ownership.json
      SPACE_BROWSER_SESSIONS_ENABLED: "${SPACEAPP_BROWSER_ENABLED}"
      SPACE_BROWSER_HOST_TRANSPORT: unix
      SPACE_BROWSER_HOST_SOCKET: /run/spaceapp-browser/browser-host.sock
      SPACE_BROWSER_SESSIONS_DEFAULT_URL: about:blank
    ports:
      - "${SPACEAPP_BIND_HOST}:${SPACEAPP_PORT}:4911"
    volumes:
      - spaceapp-data:/var/lib/spaceapp
      - spaceapp-memory:/var/lib/spaceapp/memory
      - spaceapp-cli-socket:/run/spaceapp-cli
      - spaceapp-browser-socket:/run/spaceapp-browser
      - spaceapp-workspaces:/workspaces
      # Only Codex's session logs, read-only, to see a Codex pane's turns; never the Codex home or its credentials.
      - spaceapp-codex-sessions:/var/lib/spaceapp-cli/providers/codex/sessions:ro
      - ./backups:/backups
    secrets:
      - setup-token
      - session-secret
      - database-url
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
        required: false
      spaceapp-cli:
        condition: service_started
      codex-sessions-init:
        condition: service_completed_successfully
    networks:
      - spaceapp

  spaceapp-cli:
    image: ghcr.io/oll4com/spaceapp-cli:${SPACEAPP_IMAGE_TAG}${SPACEAPP_CLI_IMAGE_DIGEST:-}
    restart: unless-stopped
    init: true
    # compose.workspaces.yml adds the user-namespace profile where the host allows user namespaces (F17).
    security_opt:
      - no-new-privileges:true
    mem_limit: "${SPACEAPP_CLI_MEMORY_LIMIT}"
    cpus: "${SPACEAPP_CLI_CPU_LIMIT}"
    environment:
      SPACE_PUBLIC_DISTRIBUTION: "true"
      SPACE_MEMORY_ROOT: /var/lib/spaceapp/memory
      SPACE_CLI_HOST_SOCKET: /run/spaceapp-cli/host.sock
    volumes:
      - spaceapp-cli-state:/var/lib/spaceapp-cli
      - spaceapp-codex-sessions:/var/lib/spaceapp-cli/providers/codex/sessions
      - spaceapp-memory:/var/lib/spaceapp/memory
      - spaceapp-cli-socket:/run/spaceapp-cli
      - spaceapp-workspaces:/workspaces
      - ./secrets/providers:/run/spaceapp-secrets/providers:ro
    depends_on:
      codex-sessions-init:
        condition: service_completed_successfully
    networks:
      - spaceapp

  # One-shot: Codex's session logs live in their own volume so the API can mount them alone. It gives the volume to the
  # CLI user and, while it is still empty, copies the sessions an earlier installation kept in spaceapp-cli-state.
  codex-sessions-init:
    image: ghcr.io/oll4com/spaceapp-cli:${SPACEAPP_IMAGE_TAG}${SPACEAPP_CLI_IMAGE_DIGEST:-}
    restart: "no"
    user: "0:0"
    network_mode: none
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - sh
      - -c
      - >-
        set -eu;
        old=/cli-state/providers/codex/sessions;
        if [ -d "$$old" ] && [ -z "$$(ls -A /sessions)" ]; then cp -a "$$old/." /sessions/; fi;
        chown 10001:10001 /sessions; chmod 0700 /sessions
    volumes:
      - spaceapp-cli-state:/cli-state:ro
      - spaceapp-codex-sessions:/sessions

  spaceapp-browser:
    image: ghcr.io/oll4com/spaceapp-browser:${SPACEAPP_IMAGE_TAG}${SPACEAPP_BROWSER_IMAGE_DIGEST:-}
    profiles: ["standard"]
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: "${SPACEAPP_BROWSER_MEMORY_LIMIT}"
    cpus: "${SPACEAPP_BROWSER_CPU_LIMIT}"
    environment:
      SPACE_PUBLIC_DISTRIBUTION: "true"
      SPACE_RUNTIME_STORE: postgres
      SPACE_DATABASE_URL_FILE: /run/secrets/database-url
      SPACE_ARTIFACT_ROOT: /var/lib/spaceapp/artifacts
      SPACE_BROWSER_SESSIONS_ENABLED: "true"
      SPACE_BROWSER_HOST_SOCKET: /run/spaceapp-browser/browser-host.sock
      SPACE_BROWSER_SESSIONS_DEFAULT_URL: about:blank
    volumes:
      - spaceapp-data:/var/lib/spaceapp
      - spaceapp-browser-socket:/run/spaceapp-browser
    secrets:
      - database-url
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - spaceapp

  codex-lb:
    image: ghcr.io/soju06/codex-lb:1.22.0@sha256:3010b3c5567522fbb6e7225bdbe963fa1038c2584641fcec69094875e40e36e5
    profiles: ["companions"]
    restart: unless-stopped
    init: true
    mem_limit: "768m"
    cpus: "1.0"
    ports:
      - "${SPACEAPP_BIND_HOST}:2455:2455"
      - "${SPACEAPP_BIND_HOST}:1455:1455"
    volumes:
      - spaceapp-codex-lb:/var/lib/codex-lb
    networks:
      - spaceapp

  headroom:
    image: ghcr.io/oll4com/headroom-codex-lb:code-5b15319@sha256:491c856a8bd8205d45e980370c3ffe7ffe438b6444216c36ac7c60ad24308aa2
    profiles: ["companions"]
    restart: unless-stopped
    init: true
    mem_limit: "768m"
    cpus: "1.0"
    environment:
      HEADROOM_HOST: "0.0.0.0"
      OPENAI_TARGET_API_URL: "${SPACEAPP_COMPANIONS_OPENAI_TARGET_API_URL:-}"
    ports:
      - "${SPACEAPP_BIND_HOST}:8787:8787"
    networks:
      - spaceapp

  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie@sha256:7a7e9f22015b67edb4bef5c59daeebcd7e74bfa570df6ce60ae01237c8648a84
    restart: unless-stopped
    mem_limit: "${SPACEAPP_POSTGRES_MEMORY_LIMIT}"
    cpus: "${SPACEAPP_POSTGRES_CPU_LIMIT}"
    environment:
      POSTGRES_DB: spaceapp
      POSTGRES_USER: spaceapp
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - spaceapp-postgres:/var/lib/postgresql/data
    secrets:
      - postgres-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spaceapp -d spaceapp"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - spaceapp

  temporal:
    image: temporalio/auto-setup:1.29.7@sha256:f14912b699cf73015ad5c4fc18d522d4b014db90e794039214dfb7c022c2644f
    profiles: ["workflows"]
    restart: unless-stopped
    mem_limit: "${SPACEAPP_TEMPORAL_MEMORY_LIMIT}"
    cpus: "${SPACEAPP_TEMPORAL_CPU_LIMIT}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: spaceapp
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - export POSTGRES_PWD="$$(cat /run/secrets/postgres-password)"; exec /etc/temporal/entrypoint.sh autosetup
    secrets:
      - postgres-password
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address temporal:7233 >/dev/null && temporal operator namespace describe --namespace default --address temporal:7233 >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - spaceapp

networks:
  spaceapp:
    internal: false

secrets:
  setup-token:
    file: ./secrets/setup-token
  database-url:
    file: ./secrets/database-url
  session-secret:
    file: ./secrets/session-secret
  postgres-password:
    file: ./secrets/postgres-password

volumes:
  spaceapp-data:
  spaceapp-cli-state:
  spaceapp-codex-sessions:
  spaceapp-cli-socket:
  spaceapp-browser-socket:
  spaceapp-memory:
  spaceapp-postgres:
  spaceapp-workspaces:
  spaceapp-codex-lb:
