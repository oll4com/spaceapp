version: '3.8'
services:
  core:
    image: spaceapp/core
    volumes:
      - ./data:/data
    networks:
      - default
  cli:
    image: spaceapp/cli
    depends_on:
      - core
    volumes:
      - ./data:/data
    networks:
      - default
  browser:
    image: spaceapp/browser
    depends_on:
      - core
    volumes:
      - ./data:/data
    networks:
      - default
  postgresql:
    image: postgres:latest
    environment:
      POSTGRES_DB: spaceapp
      POSTGRES_USER: spaceapp
      POSTGRES_PASSWORD: spaceapp
    volumes:
      - ./data:/var/lib/postgresql/data
    networks:
      - default
  pgvector:
    image: pgvector:latest
    depends_on:
      - postgresql
    volumes:
      - ./data:/var/lib/postgresql/data
    networks:
      - default
  temporal:
    image: temporalio/temporal:latest
    depends_on:
      - core
    volumes:
      - ./data:/data
    networks:
      - default
networks:
  default:
    driver: bridge
