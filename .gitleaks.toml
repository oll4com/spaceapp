# Default gitleaks rules, minus documentation placeholders such as
# DOUBAO_TTS_API_KEY=<your_api_key> in third-party skill guides (Security workflow, 1.1.4).
# The generic rule captures the line after the placeholder as its "secret", so the match is checked.
[extend]
useDefault = true

[allowlist]
description = "Documentation placeholders, not credentials"
regexTarget = "match"
regexes = ['''^your_[a-z_]+>''']
