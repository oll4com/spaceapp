# Default gitleaks rules, minus documentation placeholders such as
# DOUBAO_TTS_API_KEY=<your_api_key> in third-party skill guides (Security workflow, 1.1.4).
# The generic rule captures the line after the placeholder as its "secret", so the match is checked.
[extend]
useDefault = true

[allowlist]
description = "Documentation placeholders, public OAuth/telemetry client constants, and test fixtures"
regexTarget = "match"
regexes = [
  '''^your_[a-z_]+>''',
  '''phc_zjjbX0PnWxERXrMHhkEJWj9A9BhGVLRReICgsfTMmpx''',
  '''9d1c250a-e61b-44d9-88ed-5944d1962f5e'''
]
paths = [
  '''apps/[^/]+/tests/.*''',
  '''packages/[^/]+/tests/.*''',
  '''docs/quality/.*'''
]
