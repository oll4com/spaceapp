# Default gitleaks rules, minus documentation placeholders such as
# DOUBAO_TTS_API_KEY=<your_api_key> in third-party skill guides (Security workflow, 1.1.4)
# and test fixture / quality note placeholders (#211).
[extend]
useDefault = true

[allowlist]
description = "Documentation placeholders and test fixtures that trip generic-api-key (#211)"
regexTarget = "match"
regexes = ['''^your_[a-z_]+>''']
paths = [
  '''apps/[^/]+/tests/.*''',
  '''packages/[^/]+/tests/.*''',
  '''docs/quality/.*''',
]
