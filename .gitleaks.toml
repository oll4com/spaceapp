# Default gitleaks rules, minus documentation placeholders such as
# DOUBAO_TTS_API_KEY=<your_api_key> in third-party skill guides (Security workflow, 1.1.4)
# and synthetic test fixture placeholders that trip generic-api-key in full-history scans (#211).
[extend]
useDefault = true

[[allowlists]]
description = "Documentation placeholders, not credentials"
regexTarget = "match"
regexes = ['''^your_[a-z_]+>''']

[[allowlists]]
description = "Test fixtures and quality checkpoint notes use synthetic placeholder keys that trip generic-api-key (#211)"
regexTarget = "match"
paths = [
  '''apps/[^/]+/tests/.*''',
  '''packages/[^/]+/tests/.*''',
  '''docs/quality/.*''',
  '''agent-skills/space-hyperframes/media-use/scripts/lib/telemetry\.mjs''',
  '''packages/gateway/src/providers/claude/oauth\.ts''',
]
