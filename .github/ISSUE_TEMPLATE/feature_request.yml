name: Feature request
description: Propose a focused improvement to SpaceApp
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the user need without including private workspace data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe observable behavior rather than a required implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: The request preserves the single-owner security model, or explains why a new security design is required.
          required: true
        - label: I removed credentials, personal memory, private paths, and customer data.
          required: true
