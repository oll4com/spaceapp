name: Install check

# Installs the published run-spaceapp from npm the way a user does (no checkout), then checks /readyz.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "run-spaceapp version or npm tag (latest, next, 1.2.1)"
        required: true
        default: latest

permissions:
  contents: read

jobs:
  install:
    name: Install / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel dropped: its runner lost contact after 50 min in the Docker Desktop install (run 43270988107).
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"

      - name: Install run-spaceapp@${{ inputs.version }}
        shell: bash
        run: |
          [[ "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?|latest|next)$ ]] || { echo "bad version: $VERSION"; exit 2; }
          npx --yes "run-spaceapp@$VERSION" --version
          npx --yes "run-spaceapp@$VERSION" install --non-interactive \
            --answers '{"confirm":true,"profile":"auto","access":"isolated","companions":false,"telemetry":false,"open":false}'

      - name: Post-install health check
        if: always()
        shell: bash
        run: |
          npx --yes "run-spaceapp@$VERSION" doctor || true
          npx --yes "run-spaceapp@$VERSION" status || true
          curl -fsS --max-time 10 http://127.0.0.1:4911/readyz | tee readyz.json
          grep -q '"ok":true' readyz.json
