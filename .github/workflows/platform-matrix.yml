name: Platform matrix

on:
  pull_request:
    paths:
      - "packages/run-spaceapp/**"
      - "package-lock.json"
      - ".github/workflows/platform-matrix.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher:
    name: Launcher / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22.23.0"
          - os: macos-latest
            node: "22.23.0"
          - os: windows-latest
            node: "22.23.0"
          - os: windows-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install workspace dependencies on supported hosts
        if: runner.arch != 'ARM64'
        run: npm ci

      - name: Install source workspace for the intentional x64 package rejection test
        if: runner.arch == 'ARM64'
        run: npm ci --force

      - run: npm test -w run-spaceapp
      - run: npm run check -w run-spaceapp
      - run: npm run pack:dry-run -w run-spaceapp
      - run: node packages/run-spaceapp/bin/spaceapp.mjs --version

  podman:
    name: Podman / ubuntu-latest / Node 22.23.0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.0"
          cache: npm

      - name: Install Podman and docker-compose provider
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg lsb-release
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list
          sudo apt-get update
          sudo apt-get install -y podman docker-compose-plugin
          podman_version=$(podman --version | awk '{print $3}')
          echo "Podman version: $podman_version"
          required="4.9.0"
          if [ "$(printf '%s\n' "$required" "$podman_version" | sort -V | head -n1)" != "$required" ]; then
            echo "Podman $podman_version is older than required $required"
            exit 1
          fi
          podman compose version

      - name: Install workspace dependencies
        run: npm ci

      - name: Non-interactive install with Podman (small profile)
        env:
          SPACEAPP_HOME: ${{ runner.temp }}/spaceapp-podman-ci
        run: |
          node packages/run-spaceapp/bin/spaceapp.mjs install \
            --engine podman \
            --profile small \
            --non-interactive \
            --answers '{"confirm":true,"profile":"small","access":"isolated","engine":"podman","companions":false,"telemetry":false,"open":false}'

      - name: Wait for /readyz
        env:
          SPACEAPP_HOME: ${{ runner.temp }}/spaceapp-podman-ci
        run: |
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:4911/readyz | grep -q '"ok":true'; then
              echo "SpaceApp is ready"
              exit 0
            fi
            sleep 5
          done
          echo "SpaceApp did not become ready"
          node packages/run-spaceapp/bin/spaceapp.mjs logs
          exit 1

      - name: Doctor with Podman
        env:
          SPACEAPP_HOME: ${{ runner.temp }}/spaceapp-podman-ci
        run: node packages/run-spaceapp/bin/spaceapp.mjs doctor

      - name: Backup with Podman
        env:
          SPACEAPP_HOME: ${{ runner.temp }}/spaceapp-podman-ci
        run: node packages/run-spaceapp/bin/spaceapp.mjs backup

      - name: Uninstall with purge
        env:
          SPACEAPP_HOME: ${{ runner.temp }}/spaceapp-podman-ci
        run: |
          node packages/run-spaceapp/bin/spaceapp.mjs uninstall --purge-data --non-interactive --answers '{"purgeConfirm":"DELETE"}'

      - name: Assert no installation residue
        env:
          SPACEAPP_HOME: ${{ runner.temp }}/spaceapp-podman-ci
        run: |
          if podman ps -a --format '{{.Names}}' | grep -q "spaceapp-"; then
            echo "Unexpected containers remain:"
            podman ps -a
            exit 1
          fi
          if podman volume ls --format '{{.Name}}' | grep -q "spaceapp-"; then
            echo "Unexpected volumes remain:"
            podman volume ls
            exit 1
          fi
          rm -rf "$SPACEAPP_HOME"
          if [ -d "$SPACEAPP_HOME" ]; then
            echo "Unexpected residue: $SPACEAPP_HOME"
            find "$SPACEAPP_HOME" -maxdepth 2
            exit 1
          fi
          echo "No installation residue"
