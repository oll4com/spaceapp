name: Platform matrix

on:
  pull_request:
    paths:
      - "packages/run-spaceapp/**"
      - "package-lock.json"
      - ".github/workflows/platform-matrix.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher:
    name: Launcher / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22.23.0"
          - os: macos-latest
            node: "22.23.0"
          - os: windows-latest
            node: "22.23.0"
          - os: windows-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install workspace dependencies on supported hosts
        if: runner.arch != 'ARM64'
        run: npm ci

      - name: Install source workspace for the intentional x64 package rejection test
        if: runner.arch == 'ARM64'
        run: npm ci --force

      - run: npm test -w run-spaceapp
      - run: npm run check -w run-spaceapp
      - run: npm run pack:dry-run -w run-spaceapp
      - run: node packages/run-spaceapp/bin/spaceapp.mjs --version

  podman-linux:
    name: Podman Engine / ubuntu-26.04 / Node 22.23.0
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.0"
          cache: npm

      - name: Install Podman and compose provider
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-compose jq

      - name: Verify Podman version and rootless configuration
        run: |
          PODMAN_VER=$(podman --version | awk '{print $3}')
          echo "Installed Podman version: $PODMAN_VER"
          # Assert Podman >= 5.0
          MAJOR_VER=$(echo "$PODMAN_VER" | cut -d. -f1)
          if [ "$MAJOR_VER" -lt 5 ]; then
            echo "ERROR: Podman major version must be >= 5 (got $PODMAN_VER)"
            exit 1
          fi

          # Assert Compose provider version
          podman compose version

          # Assert rootless execution and cgroup v2
          ROOTLESS=$(podman info --format '{{.Host.Security.Rootless}}')
          if [ "$ROOTLESS" != "true" ]; then
            echo "ERROR: Podman is not running rootless"
            exit 1
          fi
          CGROUP=$(podman info --format '{{.Host.CgroupVersion}}')
          if [ "$CGROUP" != "v2" ]; then
            echo "ERROR: Podman cgroupVersion is not v2 (got $CGROUP)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run launcher tests
        run: npm test -w run-spaceapp

      - name: Check launcher types and syntax
        run: npm run check -w run-spaceapp

      - name: Execute end-to-end Podman lifecycle verification
        run: |
          # 1. Non-interactive fresh install with small profile and podman engine
          node packages/run-spaceapp/bin/spaceapp.mjs install --engine podman --profile small --access isolated --no-open --non-interactive --answers '{"confirm":true,"profile":"small","access":"isolated","companions":false,"telemetry":false,"open":false}'

          # 2. Check service status
          node packages/run-spaceapp/bin/spaceapp.mjs status

          # 3. Check application readiness
          curl -sf http://127.0.0.1:4911/readyz | jq -e '.ok == true'

          # 4. Create and verify backup
          node packages/run-spaceapp/bin/spaceapp.mjs backup

      - name: Teardown and data purge verification
        if: always()
        run: |
          # 5. Clean teardown and data purge
          node packages/run-spaceapp/bin/spaceapp.mjs down
          node packages/run-spaceapp/bin/spaceapp.mjs uninstall --purge-data --non-interactive --answers '{"purgeConfirm":"DELETE"}'

          # 6. Verify zero residual SpaceApp containers, pods, or volumes
          # Resolve project name using launcher runtime authority
          PROJECT_NAME=$(node --input-type=module -e '
            const { resolveSpaceAppHome, composeProjectName } = await import("./packages/run-spaceapp/src/index.mjs");
            console.log(composeProjectName(resolveSpaceAppHome()));
          ')
          echo "Verifying cleanup for project: $PROJECT_NAME"

          LEFTOVER_CONTAINERS=$(podman ps -a --filter "label=io.podman.compose.project=$PROJECT_NAME" -q; podman ps -a --filter "label=com.docker.compose.project=$PROJECT_NAME" -q | sort -u)
          if [ -n "$LEFTOVER_CONTAINERS" ]; then
            echo "ERROR: Residual containers found for project $PROJECT_NAME: $LEFTOVER_CONTAINERS"
            exit 1
          fi

          LEFTOVER_VOLUMES=$(podman volume ls --filter "label=io.podman.compose.project=$PROJECT_NAME" -q; podman volume ls --filter "label=com.docker.compose.project=$PROJECT_NAME" -q | sort -u)
          if [ -n "$LEFTOVER_VOLUMES" ]; then
            echo "ERROR: Residual volumes found for project $PROJECT_NAME: $LEFTOVER_VOLUMES"
            exit 1
          fi
          echo "Cleanup verified: zero residual containers or volumes"
