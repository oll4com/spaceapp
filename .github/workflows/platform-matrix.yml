name: Platform matrix

on:
  pull_request:
    paths:
      - "packages/run-spaceapp/**"
      - "package-lock.json"
      - ".github/workflows/platform-matrix.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher:
    name: Launcher / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22.23.0"
          - os: macos-latest
            node: "22.23.0"
          - os: windows-latest
            node: "22.23.0"
          - os: windows-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install workspace dependencies on supported hosts
        if: runner.arch != 'ARM64'
        run: npm ci

      - name: Install source workspace for the intentional x64 package rejection test
        if: runner.arch == 'ARM64'
        run: npm ci --force

      - run: npm test -w run-spaceapp
      - run: npm run check -w run-spaceapp
      - run: npm run pack:dry-run -w run-spaceapp
      - run: node packages/run-spaceapp/bin/spaceapp.mjs --version

  # Issue #63 acceptance: a real rootless Podman install of the small profile on Linux — install,
  # wait for /readyz, back up, purge, and leave nothing running.
  podman-linux:
    name: Launcher / ubuntu-latest / Podman rootless
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.0"
          cache: npm

      # ubuntu-latest ships Podman 4.9; the launcher supports Podman >= 5, so install it from the
      # libcontainers (Kubic) repository, the upstream packagers' channel for current Podman on Ubuntu.
      - name: Install Podman 5
        run: |
          . /etc/os-release
          echo "deb http://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_${VERSION_ID}/ /" | sudo tee /etc/apt/sources.list.d/devel-kubic-libcontainers-unstable.list
          curl -fsSL "https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_${VERSION_ID}/Release.key" | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/devel-kubic-libcontainers-unstable.gpg > /dev/null
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version

      # The supported Compose provider is Docker Compose v2. The runner image carries the Docker CLI
      # plugin; expose it where Podman's provider lookup finds it, then prove `podman compose` works.
      - name: Provide the Docker Compose v2 provider for podman compose
        run: |
          if ! podman compose version >/dev/null 2>&1; then
            plugin="$(find /usr/libexec/docker /usr/lib/docker /usr/local/lib/docker -name docker-compose -type f 2>/dev/null | head -n 1)"
            test -n "$plugin"
            sudo ln -sf "$plugin" /usr/local/bin/docker-compose
          fi
          podman compose version

      # Rootless prerequisites: subordinate id ranges and the API socket the Compose provider dials.
      - name: Prepare rootless Podman
        run: |
          grep -q "^runner:" /etc/subuid || sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 runner
          mkdir -p "/run/user/$(id -u)/podman"
          nohup podman system service --time=0 "unix:///run/user/$(id -u)/podman/podman.sock" >/tmp/podman-service.log 2>&1 &
          podman info --format 'rootless={{.Host.Security.Rootless}} cgroup={{.Host.CgroupVersion}} version={{.Version.Version}}'

      - name: Install workspace dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Install SpaceApp small on rootless Podman
        run: |
          node packages/run-spaceapp/bin/spaceapp.mjs install --engine podman --profile small --non-interactive \
            --answers '{"confirm":true,"profile":"small","access":"isolated","engine":"podman","companions":false,"telemetry":false,"open":false}'
        env:
          SPACEAPP_HOME: ${{ runner.temp }}/spaceapp-home

      - name: Wait for the application to answer on 127.0.0.1:4911
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4911/readyz; then exit 0; fi
            sleep 5
          done
          echo "SpaceApp did not become ready" >&2
          exit 1

      - name: Back up the Podman installation
        run: node packages/run-spaceapp/bin/spaceapp.mjs backup
        env:
          SPACEAPP_HOME: ${{ runner.temp }}/spaceapp-home

      - name: Uninstall with data purge and confirm nothing is left running
        run: |
          node packages/run-spaceapp/bin/spaceapp.mjs uninstall --purge-data --non-interactive \
            --answers '{"purgeConfirm":"DELETE"}'
          test -z "$(podman ps -q)"
          test -z "$(podman ps -aq)"
        env:
          SPACEAPP_HOME: ${{ runner.temp }}/spaceapp-home
