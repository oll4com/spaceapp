name: Platform matrix

on:
  pull_request:
    paths:
      - "packages/run-spaceapp/**"
      - "package-lock.json"
      - ".github/workflows/platform-matrix.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher:
    name: Launcher / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22.23.0"
          - os: macos-latest
            node: "22.23.0"
          - os: windows-latest
            node: "22.23.0"
          - os: windows-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install workspace dependencies on supported hosts
        if: runner.arch != 'ARM64'
        run: npm ci

      - name: Install source workspace for the intentional x64 package rejection test
        if: runner.arch == 'ARM64'
        run: npm ci --force

      - run: npm test -w run-spaceapp
      - run: npm run check -w run-spaceapp
      - run: npm run pack:dry-run -w run-spaceapp
      - run: node packages/run-spaceapp/bin/spaceapp.mjs --version

  podman:
    name: Podman / ubuntu-latest / small profile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.0"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Verify rootless Podman and the Compose v2 provider
        run: |
          podman --version
          podman info --format '{{.Host.Security.Rootless}} {{.Host.CgroupVersion}}'
          if ! podman compose version >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y docker-compose-v2 || {
              sudo curl -fsSL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            }
          fi
          podman compose version

      - name: Install the small profile with Podman
        run: >
          node packages/run-spaceapp/bin/spaceapp.mjs install
          --engine podman --profile small --no-open --non-interactive
          --answers '{"confirm":true,"profile":"small","access":"isolated","companions":false,"telemetry":false,"open":false}'
        env:
          SPACEAPP_HOME: ${{ runner.temp }}/spaceapp-podman

      - name: Wait for /readyz
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4911/readyz; then exit 0; fi
            sleep 10
          done
          echo "SpaceApp did not become ready on Podman" >&2
          exit 1

      - name: Back up the Podman installation
        run: node packages/run-spaceapp/bin/spaceapp.mjs backup
        env:
          SPACEAPP_HOME: ${{ runner.temp }}/spaceapp-podman

      - name: Purge the Podman installation
        run: >
          node packages/run-spaceapp/bin/spaceapp.mjs uninstall --purge-data
          --non-interactive --answers '{"confirm":true,"purge":"DELETE"}'
        env:
          SPACEAPP_HOME: ${{ runner.temp }}/spaceapp-podman

      - name: Verify nothing is left running
        run: |
          test -z "$(podman ps -aq)"
          test -z "$(podman volume ls -q --filter name=spaceapp || true)"
