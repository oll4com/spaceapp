name: Platform matrix

on:
  pull_request:
    paths:
      - "packages/run-spaceapp/**"
      - "package-lock.json"
      - ".github/workflows/platform-matrix.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher:
    name: Launcher / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22.23.0"
          - os: macos-latest
            node: "22.23.0"
          - os: windows-latest
            node: "22.23.0"
          - os: windows-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install workspace dependencies on supported hosts
        if: runner.arch != 'ARM64'
        run: npm ci

      - name: Install source workspace for the intentional x64 package rejection test
        if: runner.arch == 'ARM64'
        run: npm ci --force

      - run: npm test -w run-spaceapp
      - run: npm run check -w run-spaceapp
      - run: npm run pack:dry-run -w run-spaceapp
      - run: node packages/run-spaceapp/bin/spaceapp.mjs --version

  podman-rootless:
    name: Launcher / Podman rootless / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install and configure rootless Podman with Compose v2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman podman-compose uidmap slirp4netns fuse-overlayfs
          sudo mkdir -p /etc/systemd/system/user@.service.d
          printf '[Service]\nDelegate=cpu cpuset io memory pids\n' | sudo tee /etc/systemd/system/user@.service.d/delegate.conf >/dev/null
          sudo systemctl daemon-reload
          sudo loginctl enable-linger "$USER" || true
          systemctl --user enable --now podman.socket
          podman --version
          podman compose version
          podman info --format '{{.Host.Security.Rootless}}'

      - name: Run launcher tests under rootless Podman environment
        run: npm test -w run-spaceapp

      - name: Typecheck and lint launcher
        run: npm run check -w run-spaceapp

      - name: Pack launcher candidate
        run: npm run pack:dry-run -w run-spaceapp

      - name: Verify CLI executable
        run: node packages/run-spaceapp/bin/spaceapp.mjs --version

      - name: Validate rendered Podman Compose configuration with real provider
        run: |
          export SPACEAPP_HOME="$RUNNER_TEMP/spaceapp-podman-validate"
          node --input-type=module -e '
            import { prepareInstallation, writeRuntimeFiles } from "./packages/run-spaceapp/src/index.mjs";
            const root = process.env.SPACEAPP_HOME;
            const res = await prepareInstallation(root, { version: "0.2.5", profile: "small", engine: "podman", accessMode: "isolated" });
            await writeRuntimeFiles(root, res.config);
          '
          podman compose -f "$SPACEAPP_HOME/compose.yml" -f "$SPACEAPP_HOME/compose.podman.yml" config

      - name: Run rootless Podman lifecycle verification
        run: |
          export SPACEAPP_HOME="$RUNNER_TEMP/spaceapp-podman-ci"
          export SPACEAPP_TELEMETRY="0"
          node packages/run-spaceapp/bin/spaceapp.mjs install --engine podman --profile small --non-interactive --no-open --answers '{"confirm":true,"telemetry":false}'
          curl --retry 30 --retry-delay 2 --retry-all-errors -fsS http://127.0.0.1:4911/readyz
          node packages/run-spaceapp/bin/spaceapp.mjs backup
          printf 'DELETE\n' | node packages/run-spaceapp/bin/spaceapp.mjs uninstall --purge-data
          test -z "$(podman ps -q)"

