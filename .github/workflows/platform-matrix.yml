name: Platform matrix

on:
  pull_request:
    paths:
      - "packages/run-spaceapp/**"
      - "package-lock.json"
      - ".github/workflows/platform-matrix.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher:
    name: Launcher / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22.23.0"
          - os: macos-latest
            node: "22.23.0"
          - os: windows-latest
            node: "22.23.0"
          - os: windows-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install workspace dependencies on supported hosts
        if: runner.arch != 'ARM64'
        run: npm ci

      - name: Install source workspace for the intentional x64 package rejection test
        if: runner.arch == 'ARM64'
        run: npm ci --force

      - run: npm test -w run-spaceapp
      - run: npm run check -w run-spaceapp
      - run: npm run pack:dry-run -w run-spaceapp
      - run: node packages/run-spaceapp/bin/spaceapp.mjs --version

  podman-linux:
    name: Launcher / ubuntu-latest / Rootless Podman (small)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.0"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Ensure rootless Podman 5+ and cgroup v2 delegation
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs dbus-user-session docker-compose-v2
          PODMAN_MAJOR="$(podman --version | sed -E 's/.*version ([0-9]+).*/\1/')"
          if [ "${PODMAN_MAJOR:-0}" -lt 5 ]; then
            PODMAN_STATIC_VERSION="v5.8.8"
            PODMAN_STATIC_SHA256="e0e12f9de61bdb054d19a77df0e84ddd51cadfee13688e0fb607d61b6833e8cd"
            if curl -fsSL -o /tmp/podman-linux-amd64.tar.gz "https://github.com/mgoltzsche/podman-static/releases/download/${PODMAN_STATIC_VERSION}/podman-linux-amd64.tar.gz" && \
               echo "${PODMAN_STATIC_SHA256}  /tmp/podman-linux-amd64.tar.gz" | sha256sum -c -; then
              tar -xzf /tmp/podman-linux-amd64.tar.gz -C /tmp
              sudo cp -r /tmp/podman-linux-amd64/usr /tmp/podman-linux-amd64/etc /
              sudo cp -f /usr/local/bin/podman /usr/bin/podman || true
              hash -r
            elif [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
              /home/linuxbrew/.linuxbrew/bin/brew install podman
              echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
              export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
            fi
          fi
          sudo mkdir -p /etc/systemd/system/user@.service.d
          printf "[Service]\nDelegate=cpu cpuset io memory pids\n" | sudo tee /etc/systemd/system/user@.service.d/delegate.conf >/dev/null
          sudo systemctl daemon-reload
          sudo loginctl enable-linger "$USER" || true
          sudo systemctl start "user@$(id -u).service" || true
          sudo systemctl restart "user@$(id -u).service" || true
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
          systemctl --user enable --now podman.socket || true
          if [ ! -S "${XDG_RUNTIME_DIR}/podman/podman.sock" ]; then
            mkdir -p "${XDG_RUNTIME_DIR}/podman"
            nohup podman system service --time=0 "unix://${XDG_RUNTIME_DIR}/podman/podman.sock" >/tmp/podman-service.log 2>&1 &
            for _ in $(seq 1 20); do
              [ -S "${XDG_RUNTIME_DIR}/podman/podman.sock" ] && break
              sleep 0.5
            done
          fi
          echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS}" >> "$GITHUB_ENV"
          echo "DOCKER_HOST=unix://${XDG_RUNTIME_DIR}/podman/podman.sock" >> "$GITHUB_ENV"
          podman --version
          podman compose version
          podman info --format '{{json .}}'

      - name: Install small profile with rootless Podman, verify readyz, backup, and uninstall
        env:
          SPACEAPP_HOME: ${{ runner.temp }}/spaceapp-podman-home
          SPACEAPP_TELEMETRY: "0"
        run: |
          mkdir -p "$SPACEAPP_HOME"
          node packages/run-spaceapp/bin/spaceapp.mjs install \
            --profile small \
            --engine podman \
            --non-interactive \
            --answers '{"confirm":true,"open":false}' \
            --no-open
          curl -fsS http://127.0.0.1:4911/readyz
          node packages/run-spaceapp/bin/spaceapp.mjs status
          node packages/run-spaceapp/bin/spaceapp.mjs doctor
          node packages/run-spaceapp/bin/spaceapp.mjs backup
          node packages/run-spaceapp/bin/spaceapp.mjs uninstall \
            --purge-data \
            --non-interactive \
            --answers '{"confirm":"DELETE"}'
          CONTAINERS="$(podman ps -aq)"
          if [ -n "$CONTAINERS" ]; then
            echo "Unexpected remaining Podman containers: $CONTAINERS" >&2
            podman ps -a >&2
            exit 1
          fi
          VOLUMES="$(podman volume ls -q)"
          if [ -n "$VOLUMES" ]; then
            echo "Unexpected remaining Podman volumes: $VOLUMES" >&2
            podman volume ls >&2
            exit 1
          fi

      - name: Diagnostic logs on failure
        if: failure()
        run: |
          podman ps -a || true
          podman logs $(podman ps -aq) || true

