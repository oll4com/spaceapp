name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-quality:
    name: Sanitized public quality gates
    runs-on: ubuntu-latest
    # The full workspace suites take about 25 minutes (review F15).
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: a failed provenance check names the public commit that edited an exported file.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify export provenance
        # Pull requests from forks change exported files by design; main and same-repo branches stay checked.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: node scripts/verify-export-provenance.mjs .

      - name: Create sanitized candidate
        run: >-
          node scripts/public-export.mjs
          --output "$RUNNER_TEMP/spaceapp-public-export"

      - name: Install candidate dependencies
        working-directory: ${{ runner.temp }}/spaceapp-public-export
        run: npm ci

      - name: Install ripgrep and ffmpeg (the file search tests run the real rg, the Nous attachment tests make media with ffmpeg)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep ffmpeg

      - name: Pull the compose file's PostgreSQL image (the *-postgres tests start it with --pull=never and skip without it)
        run: |
          pinned=$(grep -oE 'pgvector/pgvector:[^@ ]+@sha256:[0-9a-f]{64}' packages/run-spaceapp/templates/compose.yml)
          docker pull "$pinned" && docker tag "$pinned" "${pinned%@*}"

      - name: Give the runner the public install's connector key folder (a public install writes its key there at start; in the container it is the spaceapp-data volume)
        run: sudo install -d -m 700 -o "$(id -un)" /var/lib/spaceapp/connector

      - name: Public release tests
        working-directory: ${{ runner.temp }}/spaceapp-public-export
        run: npm run test:public

      - name: Typecheck candidate
        working-directory: ${{ runner.temp }}/spaceapp-public-export
        run: npm run check

      - name: Build candidate
        working-directory: ${{ runner.temp }}/spaceapp-public-export
        run: npm run build

      - name: Pack launcher candidate
        working-directory: ${{ runner.temp }}/spaceapp-public-export
        run: npm run pack:dry-run -w run-spaceapp
