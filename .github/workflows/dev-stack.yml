name: dev-stack

# Runs the full SpaceApp from source on a clean ubuntu-latest runner with no
# TTY: PostgreSQL + Temporal in Docker, then the API, web, worker and CLI host
# from source. It waits for /readyz, claims owner setup over HTTP through the
# real setup-token flow (no dev-login shortcut), opens an OpenCode CLI pane
# through the API and checks the pane is running, then resets and verifies that
# nothing is left behind.

on:
  pull_request:
    paths:
      - "scripts/dev-stack.mjs"
      - "scripts/tests/**"
      - "packages/run-spaceapp/templates/compose.yml"
      - "deploy/docker/**"
      - ".github/workflows/dev-stack.yml"
  workflow_dispatch:

concurrency:
  group: dev-stack-${{ github.ref }}
  cancel-in-progress: true

env:
  API_PORT: "5910"
  WEB_PORT: "5911"

jobs:
  dev-stack:
    name: Run the full app from source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          npm_config_fund: "false"
          npm_config_audit: "false"

      - name: Build the workspace
        run: npm run build

      - name: Unit tests for the dev-stack orchestrator
        run: node --test scripts/tests/dev-stack.test.mjs

      # ---------------------------------------------------------------
      # The real run. No TTY on CI, which is exactly what the acceptance
      # contract asks for.
      # ---------------------------------------------------------------
      - name: Start the stack from source
        run: |
          set -euo pipefail
          nohup npm run dev:stack > dev-stack.out 2>&1 &
          echo "dev-stack pid $!"

      - name: Wait for /readyz to report ok
        run: |
          set -euo pipefail
          echo "waiting for http://127.0.0.1:${API_PORT}/readyz"
          for i in $(seq 1 150); do
            if curl -fsS "http://127.0.0.1:${API_PORT}/readyz" -o readyz.json 2>/dev/null; then
              echo "readyz: $(cat readyz.json)"
              if grep -q '"ok"[: ]*true' readyz.json; then
                echo "API is ready."
                exit 0
              fi
            fi
            sleep 2
          done
          echo "readyz never reported ok"
          # The API is not necessarily the process that died: dev-stack stops the
          # whole stack as soon as any child exits, so every service log matters.
          echo "--- dev-stack.out ---"; cat dev-stack.out || true
          echo "--- .dev-stack/logs ---"; ls -la .dev-stack/logs 2>/dev/null || true
          for f in .dev-stack/logs/*.log; do
            [ -f "$f" ] || continue
            echo "--- $f ---"; tail -n 120 "$f" || true
          done
          exit 1

      # Owner setup goes through the real setup-token flow:
      #   GET  /api/setup/status   -> { setupRequired, expiresAt }
      #   POST /api/setup/claim    -> { token, email, password }  (password >= 12)
      # The claim response sets the session cookie and returns starterRoomId.
      - name: Claim owner setup over HTTP
        run: |
          set -euo pipefail
          BASE="http://127.0.0.1:${API_PORT}"
          TOKEN="$(cat .dev-stack/secrets/setup-token)"
          echo "setup token loaded (${#TOKEN} chars)"

          curl -fsS "${BASE}/api/setup/status" -o setup-status.json -w 'setup status: %{http_code}\n'
          cat setup-status.json
          grep -q '"setupRequired"[: ]*true' setup-status.json

          curl -fsS -X POST "${BASE}/api/setup/claim" \
            -H 'content-type: application/json' \
            --data "{\"token\":\"${TOKEN}\",\"email\":\"ci-owner@example.test\",\"password\":\"ci-owner-password-1\"}" \
            -c cookies.txt -o claim.json -w 'setup claim: %{http_code}\n'
          cat claim.json

          node -e '
            const c = require("./claim.json");
            if (c.isAuthenticated !== true) { console.error("claim did not authenticate"); process.exit(1); }
            if (c.isSetupRequired !== false) { console.error("setup still required"); process.exit(1); }
            if (!c.starterRoomId) { console.error("claim returned no starterRoomId"); process.exit(1); }
            require("fs").writeFileSync("starter-room-id.txt", c.starterRoomId);
            console.log("owner claimed; starter room:", c.starterRoomId);
          '

      # Every non-GET /api/ request made with a session must carry the CSRF
      # header the API names, or the request guard answers 403 CSRF_INVALID.
      # The claim above succeeded without one only because there was no session
      # yet and the guard skips unauthenticated requests.
      - name: Fetch the CSRF token the session needs
        run: |
          set -euo pipefail
          BASE="http://127.0.0.1:${API_PORT}"
          curl -fsS -b cookies.txt "${BASE}/api/auth/csrf" -o csrf.json -w 'csrf: %{http_code}\n'
          cat csrf.json
          node -e '
            const c = require("./csrf.json");
            if (!c.csrfToken) { console.error("no csrfToken in the response"); process.exit(1); }
            if (!c.headerName) { console.error("no headerName in the response"); process.exit(1); }
            require("fs").writeFileSync("csrf-token.txt", c.csrfToken);
            require("fs").writeFileSync("csrf-header.txt", c.headerName);
            console.log("csrf header:", c.headerName);
          '

      # The starter room is created through the documented setup route, not by
      # guessing a room id. It needs the ADMIN session the claim just issued.
      # The route takes no body, and Fastify answers 400 "Body cannot be empty
      # when content-type is set to 'application/json'" if we claim one anyway,
      # so no content-type header here.
      - name: Ensure the Getting Started room
        run: |
          set -euo pipefail
          BASE="http://127.0.0.1:${API_PORT}"
          CSRF_HEADER="$(cat csrf-header.txt)"
          CSRF_TOKEN="$(cat csrf-token.txt)"
          code="$(curl -sS -b cookies.txt -X POST "${BASE}/api/setup/starter-room" \
            -H "${CSRF_HEADER}: ${CSRF_TOKEN}" \
            -o starter-room.json -w '%{http_code}')"
          echo "starter room: ${code}"
          cat starter-room.json
          if [ "${code}" != "200" ]; then echo "starter-room request failed"; exit 1; fi
          node -e '
            const s = require("./starter-room.json");
            const id = s.room?.id;
            if (!id) { console.error("no room id from /api/setup/starter-room"); process.exit(1); }
            require("fs").writeFileSync("starter-room-id.txt", id);
            console.log("starter room:", id);
          '

      # OpenCode CLI pane: mode TERMINAL + terminalRuntimeId "cli:opencode".
      # The runtime descriptor declares authMode "NONE", so no AI provider
      # account is needed to start the session.
      #
      # POST /api/panes only creates the pane; the CLI session that actually
      # execs OpenCode starts on POST /api/panes/:id/cli/session, and
      # GET /api/panes/:id/cli/session reports its state (null when no session
      # is active). Session status is IDLE | RUNNING | INTERRUPTING | EXITED |
      # ERROR; the pane's own status field is a different enum and does not
      # describe the CLI process.
      - name: Open an OpenCode CLI pane and check it is running
        run: |
          set -euo pipefail
          BASE="http://127.0.0.1:${API_PORT}"
          ROOM_ID="$(cat starter-room-id.txt)"
          CSRF_HEADER="$(cat csrf-header.txt)"
          CSRF_TOKEN="$(cat csrf-token.txt)"

          code="$(curl -sS -b cookies.txt -X POST "${BASE}/api/panes" \
            -H "${CSRF_HEADER}: ${CSRF_TOKEN}" \
            -H 'content-type: application/json' \
            -d "{\"roomId\":\"${ROOM_ID}\",\"title\":\"OpenCode CLI\",\"mode\":\"TERMINAL\",\"terminalRuntimeId\":\"cli:opencode\"}" \
            -o pane.json -w '%{http_code}')"
          echo "open pane: ${code}"
          cat pane.json
          if [ "${code}" != "200" ]; then echo "pane create failed"; exit 1; fi

          node -e '
            const p = require("./pane.json");
            if (!p.id) { console.error("pane create returned no id"); process.exit(1); }
            if (p.mode !== "TERMINAL") { console.error("pane mode is " + p.mode + ", expected TERMINAL"); process.exit(1); }
            if (p.terminalRuntimeId !== "cli:opencode") { console.error("wrong runtime: " + p.terminalRuntimeId); process.exit(1); }
            require("fs").writeFileSync("pane-id.txt", p.id);
            console.log("pane:", p.id, p.mode, p.terminalRuntimeId);
          '
          PANE_ID="$(cat pane-id.txt)"

          code="$(curl -sS -b cookies.txt -X POST "${BASE}/api/panes/${PANE_ID}/cli/session" \
            -H "${CSRF_HEADER}: ${CSRF_TOKEN}" \
            -H 'content-type: application/json' \
            -d '{"runtimeId":"cli:opencode"}' \
            -o session-start.json -w '%{http_code}')"
          echo "start cli session: ${code}"
          cat session-start.json
          if [ "${code}" != "200" ]; then echo "cli session start failed"; exit 1; fi

          node -e '
            const s = require("./session-start.json");
            const session = s.session;
            if (!session) { console.error("cli session start returned no session"); process.exit(1); }
            if (session.runtimeId !== "cli:opencode") { console.error("cli session runtime is " + session.runtimeId); process.exit(1); }
            if (session.status === "EXITED" || session.status === "ERROR") {
              console.error("cli session started in " + session.status); process.exit(1);
            }
            console.log("cli session:", session.sessionId, session.status);
          '

          for i in $(seq 1 45); do
            rm -f cli-session.json
            code="$(curl -sS -b cookies.txt "${BASE}/api/panes/${PANE_ID}/cli/session" -o cli-session.json -w '%{http_code}' || echo 000)"
            STATE="$(node -e '
              const fs = require("fs");
              if (fs.readFileSync("cli-session.json", "utf8").trim() === "null") { console.log("NO_SESSION"); process.exit(0); }
              let d; try { d = require("./cli-session.json"); } catch { console.log(""); process.exit(0); }
              console.log((d && d.session && d.session.status) || "");
            ')"
            echo "cli session state: ${STATE} (http ${code})"
            case "${STATE}" in
              RUNNING|IDLE)
                echo "OpenCode CLI session is up"; exit 0 ;;
              EXITED|ERROR)
                echo "OpenCode CLI session is ${STATE}"
                tail -n 120 .dev-stack/logs/cli-host.log || true
                exit 1 ;;
            esac
            sleep 2
          done
          echo "OpenCode CLI session never reached a running state"
          tail -n 120 .dev-stack/logs/cli-host.log || true
          exit 1

      # The step that starts the stack backgrounds it with `nohup ... > dev-stack.out`,
      # so its own output never reaches the log. Print the file here, while it
      # still exists: `reset` deletes .dev-stack/, and the failure dump below is
      # skipped on a green run. This is also the Linux terminal output the issue
      # asks the pull request to carry.
      - name: Print what the one command produced
        if: always()
        run: cat dev-stack.out

      # Evidence first, teardown second. `reset` deletes .dev-stack/, so a dump
      # that runs after it finds nothing left to read.
      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== dev-stack.out ==="; cat dev-stack.out || true
          echo "=== .dev-stack/logs ==="; ls -la .dev-stack/logs 2>/dev/null || true
          for f in .dev-stack/logs/*.log; do
            [ -f "$f" ] || continue
            echo "=== $f ==="; tail -n 120 "$f" || true
          done
          echo "=== containers ==="
          docker ps -a --filter "label=com.docker.compose.project=spaceapp-dev-stack" || true
          for c in $(docker ps -a --filter "label=com.docker.compose.project=spaceapp-dev-stack" --format '{{.Names}}'); do
            echo "=== docker logs $c ==="; docker logs --tail 80 "$c" 2>&1 || true
          done

      - name: Reset and verify no resources remain
        id: reset-stack
        if: always()
        run: |
          set -euo pipefail

          # Record the host processes the stack started BEFORE reset removes the
          # state directory that lists them, so the post-reset check below has
          # something to assert against. `npm run dev:stack` spawns the API, web,
          # worker and CLI host as real children; a reset that stopped only the
          # containers would leave all four running.
          echo "[]" > /tmp/dev-stack.pids.json
          if [ -f .dev-stack/dev-stack.pids.json ]; then
            cp .dev-stack/dev-stack.pids.json /tmp/dev-stack.pids.json
            echo "--- host processes recorded before reset ---"
            node -e 'for (const e of require("/tmp/dev-stack.pids.json")) console.log(`${e.name} ${e.pid}`)'
          else
            echo "no pid file was recorded before reset"
          fi

          npm run dev:stack -- reset 2>&1 | tee reset.out

          echo "--- residual check ---"
          if docker ps -a --filter "label=com.docker.compose.project=spaceapp-dev-stack" --format '{{.Names}}' | grep -q .; then
            echo "containers left behind"; docker ps -a --filter "label=com.docker.compose.project=spaceapp-dev-stack"; exit 1
          fi
          if docker volume ls --filter "label=com.docker.compose.project=spaceapp-dev-stack" --format '{{.Name}}' | grep -q .; then
            echo "volumes left behind"; docker volume ls --filter "label=com.docker.compose.project=spaceapp-dev-stack"; exit 1
          fi
          if [ -d .dev-stack ]; then
            echo ".dev-stack still exists after reset"; ls -la .dev-stack; exit 1
          fi

          # The acceptance criteria name processes alongside containers and
          # volumes. Any pid recorded above that still answers kill -0 means reset
          # left a host process behind — the worker forks its own children, so a
          # leader-only signal would show up here.
          leaked=0
          while read -r name pid; do
            [ -n "${pid:-}" ] || continue
            if kill -0 "$pid" 2>/dev/null; then
              echo "process still alive after reset: $name (pid $pid)"
              ps -o pid,ppid,pgid,stat,command -p "$pid" || true
              leaked=1
            fi
          done < <(node -e 'for (const e of require("/tmp/dev-stack.pids.json")) console.log(`${e.name} ${e.pid}`)')
          if [ "$leaked" -ne 0 ]; then
            echo "reset left host processes running"; exit 1
          fi

          echo "no containers, no volumes, no state directory and no processes left."

      # A leak after reset is its own failure mode — the acceptance criteria call
      # out leftover containers, volumes and processes specifically — so surface
      # reset's own output rather than leaving it buried in the step log.
      - name: Dump reset output when reset itself failed
        if: failure() && steps.reset-stack.outcome == 'failure'
        run: |
          echo "=== reset.out ==="; cat reset.out || true
