name: Source development stack

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-stack:
    name: Source stack / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Start Docker on macOS with Colima
        if: runner.os == 'macOS'
        run: |
          brew install colima docker docker-compose
          mkdir -p "$HOME/.docker/cli-plugins"
          ln -sf "$(brew --prefix)/opt/docker-compose/bin/docker-compose" "$HOME/.docker/cli-plugins/docker-compose"
          colima start --cpu 2 --memory 6 --disk 30 --runtime docker
          docker info
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: node --test scripts/tests/dev-stack.test.mjs scripts/tests/dev-stack-vite.test.mjs
      - name: Real source stack, owner setup, OpenCode PTY and cleanup
        run: npm run smoke:dev-stack
      - name: Stop test VM
        if: always() && runner.os == 'macOS'
        run: colima stop

  source-quality:
    name: Source quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install native test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep ffmpeg
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run hygiene:preflight
