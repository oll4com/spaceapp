name: Contributor source stack
on:
  pull_request:
  push:
    branches: [main, bounty/65-source-dev-stack]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci
      - name: Install the file-search runtime prerequisite
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - run: npm run check
      - run: npm test
      - name: Start from source, claim the owner, open OpenCode, and clean up
        run: node scripts/dev-stack-acceptance.mjs
      - name: Remove this checkout's development resources after any failure
        if: always()
        run: node scripts/dev-stack.mjs reset
