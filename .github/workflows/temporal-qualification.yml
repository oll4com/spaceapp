name: Temporal contribution qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install public-suite prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep sqlite3
      - name: Check
        run: npm run check
      - name: Prove the live and replay budget, including startup
        shell: bash
        run: |
          start=$SECONDS
          timeout --signal=TERM --kill-after=10s 180s npm run temporal:test -w @space/worker
          elapsed=$((SECONDS-start))
          echo "Temporal live + replay: ${elapsed}s, including startup" >> "$GITHUB_STEP_SUMMARY"
          test "$elapsed" -lt 180
      - name: Full public test suite
        run: npm test
      - name: Build
        run: npm run build
      - name: Hygiene
        run: npm run hygiene:preflight
