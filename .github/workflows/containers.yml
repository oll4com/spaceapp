name: Container matrix

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "!packages/run-spaceapp/**"
      - "deploy/docker/**"
      - "starter-memory/**"
      - "Dockerfile"
      - "package-lock.json"
      - "scripts/container-*.mjs"
      - "scripts/tests/container-*.test.mjs"
      - ".github/workflows/containers.yml"
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "!packages/run-spaceapp/**"
      - "deploy/docker/**"
      - "starter-memory/**"
      - "Dockerfile"
      - "package-lock.json"
      - "scripts/container-*.mjs"
      - "scripts/tests/container-*.test.mjs"
      - ".github/workflows/containers.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Runtime images / linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build core
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: core
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: spaceapp-ci:core-${{ matrix.arch }}
          provenance: false
          cache-from: type=gha,scope=runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.arch }}

      - name: Build CLI
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: cli
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: spaceapp-ci:cli-${{ matrix.arch }}
          provenance: false
          cache-from: type=gha,scope=runtime-${{ matrix.arch }}

      - name: Build browser
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: browser
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: spaceapp-ci:browser-${{ matrix.arch }}
          provenance: false
          cache-from: type=gha,scope=runtime-${{ matrix.arch }}

      - name: Enforce container size budget
        run: |
          for target in core cli browser; do
            node scripts/container-image-size-budget.mjs --target "$target" --image "spaceapp-ci:$target-${{ matrix.arch }}"
          done

      - name: Smoke real processes with pgvector, IPC, and Chromium
        run: node scripts/container-runtime-smoke.mjs spaceapp-ci "${{ matrix.arch }}"
