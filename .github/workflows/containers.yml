name: Container matrix

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "!packages/run-spaceapp/**"
      - "deploy/docker/**"
      - "starter-memory/**"
      - "Dockerfile"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "!packages/run-spaceapp/**"
      - "deploy/docker/**"
      - "starter-memory/**"
      - "Dockerfile"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }} / linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - core
          - browser
          - cli
        arch:
          - amd64
          - arm64
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: spaceapp-ci:${{ matrix.target }}-${{ matrix.arch }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}

      - name: Enforce container size budget
        run: >-
          node scripts/container-image-size-budget.mjs
          --target "${{ matrix.target }}"
          --image "spaceapp-ci:${{ matrix.target }}-${{ matrix.arch }}"

      - name: Smoke check core container (/readyz)
        if: matrix.target == 'core'
        run: |
          docker network create spaceapp-smoke-${{ matrix.arch }}
          docker run -d --name smoke-pg-${{ matrix.arch }} --network spaceapp-smoke-${{ matrix.arch }} \
            -e POSTGRES_PASSWORD=smokepassword -e POSTGRES_USER=spaceapp -e POSTGRES_DB=spaceapp \
            pgvector/pgvector:0.8.3-pg17-trixie@sha256:3a3147ccd9a0aee952bb69e1acea1eb3cc7183544185b87a662f872cfa47ae3b
          
          for i in $(seq 1 30); do
            if docker exec smoke-pg-${{ matrix.arch }} pg_isready -U spaceapp; then break; fi
            sleep 1
          done

          mkdir -p /tmp/smoke-secrets-${{ matrix.arch }}
          echo "postgres://spaceapp:smokepassword@smoke-pg-${{ matrix.arch }}:5432/spaceapp" > /tmp/smoke-secrets-${{ matrix.arch }}/database-url
          echo "smoke-session-secret-at-least-32-chars-long" > /tmp/smoke-secrets-${{ matrix.arch }}/session-secret
          echo "smoke-setup-token" > /tmp/smoke-secrets-${{ matrix.arch }}/setup-token
          chmod 0600 /tmp/smoke-secrets-${{ matrix.arch }}/*

          docker run -d --name smoke-core-${{ matrix.arch }} --network spaceapp-smoke-${{ matrix.arch }} \
            -v /tmp/smoke-secrets-${{ matrix.arch }}:/run/secrets:ro \
            -p 4911:4911 \
            spaceapp-ci:core-${{ matrix.arch }}

          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:4911/readyz | grep -q '"ok":true'; then
              echo "Core readyz smoke check passed"
              break
            fi
            sleep 2
          done

          curl -sf http://127.0.0.1:4911/readyz | grep -q '"ok":true'
          docker stop smoke-core-${{ matrix.arch }} smoke-pg-${{ matrix.arch }} || true
          docker rm -f smoke-core-${{ matrix.arch }} smoke-pg-${{ matrix.arch }} || true
          docker network rm spaceapp-smoke-${{ matrix.arch }} || true
          rm -rf /tmp/smoke-secrets-${{ matrix.arch }}

      - name: Smoke check browser container (Chromium launch)
        if: matrix.target == 'browser'
        run: |
          docker run --rm spaceapp-ci:browser-${{ matrix.arch }} \
            chromium --no-sandbox --headless --disable-gpu --dump-dom about:blank

      - name: Smoke check cli container (CLI host socket & OpenCode)
        if: matrix.target == 'cli'
        run: |
          docker run --rm spaceapp-ci:cli-${{ matrix.arch }} \
            opencode-ai --version
          
          docker run -d --name smoke-cli-${{ matrix.arch }} \
            -e SPACE_CLI_HOST_SOCKET=/run/spaceapp-cli/host.sock \
            spaceapp-ci:cli-${{ matrix.arch }}
          sleep 5
          docker exec smoke-cli-${{ matrix.arch }} node -e "
            const net = require('node:net');
            const client = net.createConnection('/run/spaceapp-cli/host.sock');
            client.on('connect', () => { console.log('CLI host socket reachable'); process.exit(0); });
            client.on('error', (err) => { console.error('Socket connect failed:', err); process.exit(1); });
            setTimeout(() => { console.error('Socket timeout'); process.exit(1); }, 5000);
          "
          docker stop smoke-cli-${{ matrix.arch }} || true
          docker rm -f smoke-cli-${{ matrix.arch }} || true
