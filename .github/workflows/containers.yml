name: Container matrix

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "!packages/run-spaceapp/**"
      - "deploy/docker/**"
      - "starter-memory/**"
      - "Dockerfile"
      - "package-lock.json"
      - "scripts/container-*.mjs"
      - "scripts/container-*.sh"
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "!packages/run-spaceapp/**"
      - "deploy/docker/**"
      - "starter-memory/**"
      - "Dockerfile"
      - "package-lock.json"
      - "scripts/container-*.mjs"
      - "scripts/container-*.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }} / linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - core
          - browser
          - cli
        arch:
          - amd64
          - arm64
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: spaceapp-ci:${{ matrix.target }}-${{ matrix.arch }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}

      - name: Enforce container size budget
        run: >-
          node scripts/container-image-size-budget.mjs
          --target "${{ matrix.target }}"
          --image "spaceapp-ci:${{ matrix.target }}-${{ matrix.arch }}"

      - name: Smoke test target startup
        run: >-
          bash scripts/container-image-smoke.sh
          "${{ matrix.target }}"
          "spaceapp-ci:${{ matrix.target }}-${{ matrix.arch }}"
          "pgvector/pgvector:0.8.3-pg17-trixie@sha256:3a3147ccd9a0aee952bb69e1acea1eb3cc7183544185b87a662f872cfa47ae3b"
