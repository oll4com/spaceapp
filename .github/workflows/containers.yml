name: Container matrix

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "!packages/run-spaceapp/**"
      - "deploy/docker/**"
      - "starter-memory/**"
      - "Dockerfile"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "!packages/run-spaceapp/**"
      - "deploy/docker/**"
      - "starter-memory/**"
      - "Dockerfile"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }} / linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - core
          - browser
          - cli
        arch:
          - amd64
          - arm64
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: spaceapp-ci:${{ matrix.target }}-${{ matrix.arch }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.arch }}

      - name: Enforce container size budget
        run: >-
          node scripts/container-image-size-budget.mjs
          --target "${{ matrix.target }}"
          --image "spaceapp-ci:${{ matrix.target }}-${{ matrix.arch }}"

      - name: Smoke check target runtime closure
        run: |
          set -euo pipefail
          IMAGE="spaceapp-ci:${{ matrix.target }}-${{ matrix.arch }}"
          PLATFORM="linux/${{ matrix.arch }}"
          if [ "${{ matrix.target }}" = "cli" ]; then
            docker run --rm --platform "$PLATFORM" --entrypoint sh "$IMAGE" -c '
              gosu spaceapp node packages/cli-host/dist/main.js &
              HOST_PID=$!
              for _ in $(seq 1 30); do
                [ -S /run/space-codex-pane-host/pane-host.sock ] && break
                sleep 0.2
              done
              test -S /run/space-codex-pane-host/pane-host.sock
              kill -TERM "$HOST_PID" && wait "$HOST_PID" || true
            '
          elif [ "${{ matrix.target }}" = "browser" ]; then
            docker run --rm --platform "$PLATFORM" --entrypoint sh "$IMAGE" -c '
              chromium --headless --no-sandbox --disable-gpu --dump-dom about:blank >/dev/null
              node -e "import(\"./apps/api/dist/config.js\"); import(\"@space/browser-host\"); import(\"@space/db\");"
            '
          elif [ "${{ matrix.target }}" = "core" ]; then
            PG_CID="$(docker run -d -e POSTGRES_USER=spaceapp -e POSTGRES_PASSWORD=spaceapp -e POSTGRES_DB=spaceapp pgvector/pgvector:pg16)"
            trap "docker rm -f $PG_CID >/dev/null 2>&1 || true" EXIT
            for _ in $(seq 1 30); do
              docker exec "$PG_CID" pg_isready -U spaceapp -d spaceapp >/dev/null 2>&1 && break
              sleep 1
            done
            PG_IP="$(docker inspect -f "{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}" "$PG_CID")"
            docker run --rm --platform "$PLATFORM" --entrypoint sh "$IMAGE" -c "
              printf 'postgresql://spaceapp:spaceapp@%s:5432/spaceapp' '$PG_IP' > /tmp/db-url
              printf '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' > /tmp/session-secret
              printf 'setup-token-smoke-test-0123456789abcdef' > /tmp/setup-token
              export SPACE_DATABASE_URL_SOURCE_FILE=/tmp/db-url
              export SPACE_SESSION_SECRET_FILE=/tmp/session-secret
              export SPACE_SETUP_TOKEN_SOURCE_FILE=/tmp/setup-token
              export SPACE_RUNTIME_STORE=postgres
              export SPACEAPP_WORKFLOWS_ENABLED=false
              /app/deploy/docker/core-entrypoint.sh &
              CORE_PID=\$!
              for _ in \$(seq 1 45); do
                if node -e \"fetch('http://127.0.0.1:4911/readyz').then(async r=>{const b=await r.json();if(!r.ok||b.ok!==true)process.exit(1)}).catch(()=>process.exit(1))\"; then
                  kill -TERM \"\$CORE_PID\" && wait \"\$CORE_PID\" || true
                  exit 0
                fi
                sleep 1
              done
              exit 1
            "
          fi
