name: Temporal replay compatibility

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporal-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  temporal-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build workspace dependencies and typecheck
        run: npm run check
      - name: Run worker suite within three minutes
        shell: bash
        run: |
          started=$SECONDS
          npm test -w @space/worker
          elapsed=$((SECONDS - started))
          echo "Worker suite: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
          test "$elapsed" -lt 180
