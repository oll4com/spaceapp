<body>
<style>
.content{position:absolute;inset:calc(var(--u)*6);align-items:center;justify-content:center;text-align:center;gap:calc(var(--u)*4)}
.content .logo{align-self:center;height:calc(var(--u)*24);max-width:60%}
.words{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2)}
.headline{font-size:calc(var(--u)*18*var(--headline-scale));letter-spacing:-.03em;line-height:1}
.sub{font-size:calc(var(--u)*4.5);color:var(--primary);opacity:1;letter-spacing:.04em}
/* A wide format (a horizontal lockup) puts the mark beside the name. */
/* No name or tagline (an app icon): the mark fills the safe box. */
.content:not(:has(.t:not(:empty))) .logo{height:calc(var(--u)*86);max-width:86%}
@media (min-aspect-ratio:2/1){.content{flex-direction:row;text-align:left;gap:calc(var(--u)*7)}.content .logo{height:calc(var(--u)*44);max-width:40%}.words{align-items:flex-start}.headline{font-size:calc(var(--u)*30*var(--headline-scale))}.sub{font-size:calc(var(--u)*7)}}
</style>
<div class="safe"><div class="content stack">{{logo}}<div class="words"><h1 class="t headline">{{headline}}</h1><p class="t sub">{{subline}}</p></div></div></div>
</body>
