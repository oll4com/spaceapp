<body>
<style>
.content{position:absolute;inset:calc(var(--u)*8);justify-content:center}
.version{font-family:var(--font-heading),"Liberation Sans","DejaVu Sans",sans-serif;font-weight:900;font-size:calc(var(--u)*18);line-height:.95;letter-spacing:-.04em;
  background:linear-gradient(100deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.headline{font-size:calc(var(--u)*7.5*var(--headline-scale))}
</style>
<div class="glow"></div>
<div class="safe"><div class="content stack">{{logo}}<div class="t badge">{{badge}}</div><div class="t version">{{version}}</div><h1 class="t headline">{{headline}}</h1><p class="t sub">{{subline}}</p><div class="t url">{{url}}</div></div></div>
</body>
